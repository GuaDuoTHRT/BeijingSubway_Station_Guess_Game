<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f5f0eb 0%, #e8e0d8 100%);
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 28px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        /* 北京地铁标识 */
        .logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0033a0;
            padding: 8px 24px 8px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 12px rgba(0, 51, 160, 0.25);
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: #0033a0;
            letter-spacing: -1px;
        }
        .logo-text {
            color: white;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 2px;
        }
        .logo-text small {
            font-weight: 300;
            font-size: 13px;
            opacity: 0.8;
            margin-left: 4px;
        }

        /* 标题 */
        .title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #1e2a3a;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #7a8a9e;
            margin-bottom: 24px;
            font-weight: 400;
        }
        .subtitle span {
            background: #eef3f8;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #2c3e50;
        }

        /* 线索区 */
        .clues {
            background: #f8f6f3;
            border-radius: 28px;
            padding: 24px 22px;
            margin-bottom: 24px;
            border: 1px solid #ede8e2;
        }
        .clue-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed #e3dcd4;
        }
        .clue-item:last-child {
            border-bottom: none;
        }
        .clue-num {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            background: #0033a0;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin-top: 1px;
        }
        .clue-text {
            font-size: 17px;
            line-height: 1.6;
            color: #1e2a3a;
            font-weight: 500;
            word-break: break-word;
        }
        .clue-text .highlight {
            color: #0033a0;
            font-weight: 700;
        }

        /* 输入 & 按钮 */
        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 16px 20px;
            border: 2px solid #dcd5cd;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 500;
            background: #fcfaf8;
            transition: 0.2s;
            outline: none;
            color: #1e2a3a;
        }
        .input-row input:focus {
            border-color: #0033a0;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 51, 160, 0.10);
        }
        .input-row input::placeholder {
            color: #b0a89e;
            font-weight: 400;
            font-size: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 16px 28px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #e8e0d8;
            color: #2c3e50;
        }
        .btn-primary {
            background: #0033a0;
            color: white;
            box-shadow: 0 4px 14px rgba(0, 51, 160, 0.25);
        }
        .btn-primary:hover {
            background: #002a85;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 51, 160, 0.30);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: #eef3f8;
            color: #1e2a3a;
        }
        .btn-secondary:hover {
            background: #e2e9f0;
        }
        .btn-success {
            background: #0f7b3a;
            color: white;
            box-shadow: 0 4px 14px rgba(15, 123, 58, 0.25);
        }
        .btn-success:hover {
            background: #0c682f;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 反馈 */
        .feedback {
            min-height: 52px;
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            transition: 0.2s;
            background: #f4f1ed;
            color: #2c3e50;
        }
        .feedback.correct {
            background: #e1f3e8;
            color: #0f7b3a;
        }
        .feedback.wrong {
            background: #fde8e8;
            color: #b33a3a;
        }
        .feedback .emoji {
            font-size: 22px;
        }

        /* 统计 */
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 14px;
            color: #7a8a9e;
            border-top: 1px solid #ede8e2;
            padding-top: 16px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .stats strong {
            color: #1e2a3a;
            font-weight: 600;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 22px 16px 28px;
                border-radius: 32px;
            }
            .logo {
                padding: 6px 16px 6px 14px;
            }
            .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }
            .logo-text {
                font-size: 15px;
            }
            .title {
                font-size: 22px;
            }
            .clue-text {
                font-size: 15px;
            }
            .input-row input {
                font-size: 15px;
                padding: 14px 16px;
            }
            .btn {
                padding: 14px 20px;
                font-size: 15px;
            }
            .feedback {
                font-size: 14px;
                padding: 12px 16px;
            }
        }
    </style>

            if (!userInput) {

                feedbackEl.innerHTML = '⚠️ 请输入站名';
                return;
            }

            // 标准化：去除多余空格，确保以“站”结尾

            if (!normalized.endsWith('站')) {
                normalized += '站';
            }

            const isCorrect = (normalized === currentStation);
